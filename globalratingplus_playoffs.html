<style>
/* === HOOPSMATIC DESIGN SYSTEM v1.0 — mirrors globalratingplus.html === */
:root {
  --bg: #f8f9fa; --surface: #fff; --surface2: #f3f4f6;
  --border: #e2e5e9; --text: #1a1a2e; --text2: #5a6070; --text-muted: #8892a6;

}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5; }
::-webkit-scrollbar{height:5px;width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}

.header { padding:1.5rem 2rem 0.75rem; }

/* === Team cards: full-width, same table layout as Top-30 === */
.teams-grid { max-width:1200px; margin:0.5rem auto 2.5rem; padding:0 2rem; display:flex; flex-direction:column; gap:1.5rem; }

.team-card-head .name { font-weight:700; font-size:1.05rem; color:var(--text); line-height:1.2; }

.team-card-head .topgr { margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--text-muted); }
.team-card-head .topgr b { color:var(--text); font-weight:600; }
.team-card .table-container { padding:0; margin:0; max-width:100%; }

.loading-state { text-align:center; padding:4rem 2rem; color:var(--text2); }

@keyframes hmSpin { to { transform:rotate(360deg); } }

.footer { max-width:1200px; margin:0 auto; padding:1.5rem 2rem 2.5rem; text-align:center; font-size:0.75rem; color:var(--text-muted); border-top:1px solid var(--border); }

@media(max-width:900px) {
  /* Cards already full-width on desktop; just tighten on narrow screens */
  .teams-grid { gap:1rem; }
}
@media(max-width:600px) {
  .header{padding:1.25rem 1rem 1rem;} .header h1{font-size:1.25rem;}

  .section-title{padding:0 1rem;} .teams-grid{padding:0 0.75rem;}
  .team-card{padding:0.85rem 0.75rem 0.4rem;}
}

<div class="header">
  <div class="header-inner">
    <div class="header-brand"><h1>NBA Global Rating Plus — 2026 Playoffs</h1></div>

<!-- ===== Top-30 Overall ===== -->
<div id="top30Wrap" style="display:none">

  </div>

</div>

<div class="footer">Hoopsmatic — NBA Global Rating Plus — 2026 Playoffs — Live data via HoopsMatic API</div>

<script>
// ──────────────────────────────────────────────────────────────
// Editor mode — ?ed=1 reveals editor-only UI (e.g., Presto button).
// Public view is unaffected.
// ──────────────────────────────────────────────────────────────
if (new URLSearchParams(location.search).get('ed') === '1') {
  document.body.classList.add('ed-mode');
}

// ──────────────────────────────────────────────────────────────
// Config — same data sources as /GlobalRatingPlus?phase=po
// ──────────────────────────────────────────────────────────────
const PROXY_BASE = 'https://hoopsmatic.com';
const RATINGS_URL  = PROXY_BASE + '/api/rm-tv';        // Sheet3 (RAT 365) — used only as a fallback name source
const RAT_BASE_URL = PROXY_BASE + '/api/rm-rat-base';  // Sheet8 (PO RAT in left block)
const DEFENSE_URL  = PROXY_BASE + '/api/defense-po';   // Defensive_Playoffs
const DEF_WEIGHT   = 0.2;
const RAT_FLOOR_ADJ = 1.5;

// NBA team-id map for logo URLs. /api/logo proxies the NBA CDN.
const NBA_TEAM_ID = {
  ATL:1610612737, BOS:1610612738, BKN:1610612751, CHA:1610612766,
  CHI:1610612741, CLE:1610612739, DAL:1610612742, DEN:1610612743,
  DET:1610612765, GSW:1610612744, HOU:1610612745, IND:1610612754,
  LAC:1610612746, LAL:1610612747, MEM:1610612763, MIA:1610612748,
  MIL:1610612749, MIN:1610612750, NOP:1610612740, NYK:1610612752,
  OKC:1610612760, ORL:1610612753, PHI:1610612755, PHX:1610612756,
  POR:1610612757, SAC:1610612758, SAS:1610612759, TOR:1610612761,
  UTA:1610612762, WAS:1610612764
};
const TEAM_FULL = {
  ATL:'Atlanta Hawks', BOS:'Boston Celtics', BKN:'Brooklyn Nets', CHA:'Charlotte Hornets',
  CHI:'Chicago Bulls', CLE:'Cleveland Cavaliers', DAL:'Dallas Mavericks', DEN:'Denver Nuggets',
  DET:'Detroit Pistons', GSW:'Golden State Warriors', HOU:'Houston Rockets', IND:'Indiana Pacers',
  LAC:'LA Clippers', LAL:'Los Angeles Lakers', MEM:'Memphis Grizzlies', MIA:'Miami Heat',
  MIL:'Milwaukee Bucks', MIN:'Minnesota Timberwolves', NOP:'New Orleans Pelicans',
  NYK:'New York Knicks', OKC:'Oklahoma City Thunder', ORL:'Orlando Magic',
  PHI:'Philadelphia 76ers', PHX:'Phoenix Suns', POR:'Portland Trail Blazers',
  SAC:'Sacramento Kings', SAS:'San Antonio Spurs', TOR:'Toronto Raptors',
  UTA:'Utah Jazz', WAS:'Washington Wizards'
};
function logoUrl(abbr) {
  const id = NBA_TEAM_ID[abbr];
  return id ? `${PROXY_BASE}/api/logo?teamId=${id}` : '';
}

// ──────────────────────────────────────────────────────────────
// CSV parser (same as main GR+ page)
// ──────────────────────────────────────────────────────────────
function parseCSV(text) {
  const rows = []; let current = '', inQuotes = false, row = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i+1] === '"') { current += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else current += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(current.trim()); current = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(current.trim());
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = []; current = '';
      } else current += ch;
    }
  }
  if (current || row.length > 0) { row.push(current.trim()); if (row.length > 1 || row[0] !== '') rows.push(row); }
  return rows;
}

// ──────────────────────────────────────────────────────────────
// Defensive_Playoffs parser — returns { playerName: {team, def, gp, mpg, ppg, rpg, apg} }
// Differs from the main page parser: we KEEP the TEAM column so we can group
// by playoff team rather than current roster team.
// ──────────────────────────────────────────────────────────────
function parseDefPO(json) {
  const out = {};
  const rows = (json && json.values) ? json.values : null;
  if (!rows || rows.length < 3) return out;
  let headerIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 6); i++) {
    const cells = (rows[i] || []).map(c => (c || '').toString().trim().toUpperCase());
    if (cells.includes('PLAYER') && cells.includes('DEF_SCORE')) { headerIdx = i; break; }
  }
  if (headerIdx < 0) return out;
  const header = rows[headerIdx].map(h => (h || '').toString().trim().toUpperCase());
  const col = n => header.indexOf(n);
  const cName=col('PLAYER'), cTeam=col('TEAM'), cScore=col('DEF_SCORE');
  const cGp=col('GP'), cMpg=col('MPG'), cPpg=col('PPG'), cRpg=col('RPG'), cApg=col('APG');
  if (cName<0 || cScore<0) return out;
  const num = (row, c) => { if (c<0) return null; const v=parseFloat(row[c]); return isNaN(v)?null:v; };
  for (let r = headerIdx + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const firstCell = (row[0] || '').toString().trim();
    if (firstCell.startsWith('[') && firstCell.endsWith(']')) break;
    const name = (row[cName] || '').toString().trim();
    const team = cTeam>=0 ? (row[cTeam] || '').toString().trim().toUpperCase() : '';
    const score = parseFloat(row[cScore]);
    if (name && !isNaN(score)) {
      out[name] = {
        team, def:score,
        gp:num(row,cGp), mpg:num(row,cMpg),
        ppg:num(row,cPpg), rpg:num(row,cRpg), apg:num(row,cApg)
      };
    }
  }
  return out;
}

// Sheet8 — left block (cols 0-2) = PO RAT. We only need the PO block here.
function parsePoRatBase(csvText) {
  const out = {};
  const rows = parseCSV(csvText);
  if (!rows || rows.length < 2) return out;
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i] || [];
    const name = (row[0] || '').trim();
    const rat = parseFloat(row[1]);
    if (name && !isNaN(rat)) out[name] = rat;
  }
  return out;
}

// ──────────────────────────────────────────────────────────────
// Compute GR+ for each player. Mirrors processData() from the main page
// with phase=po, but pulls TEAM from defense-po.
// ──────────────────────────────────────────────────────────────
function buildPlayers(defMap, poRatMap) {
  // League-avg DEF_SCORE for the deviation baseline.
  const dVals = Object.values(defMap).map(o => o && o.def).filter(v => typeof v === 'number' && !isNaN(v));
  const dAvg = dVals.length ? (dVals.reduce((s,v) => s+v, 0) / dVals.length) : 0;

  const out = [];
  for (const name in defMap) {
    const d = defMap[name];
    // Match the existing PO phase filter: must have both a defensive entry
    // (we already do — d is from defMap) AND a PO ratBase entry.
    const ratBase = poRatMap[name];
    if (typeof ratBase !== 'number') continue;
    const defAdj = (d.def - dAvg) * DEF_WEIGHT;
    const globalPlus = ratBase + defAdj + RAT_FLOOR_ADJ;
    out.push({
      player: name,
      team: d.team || '',
      ratBase, def:d.def, defAdj, globalPlus,
      gp:d.gp, mpg:d.mpg, ppg:d.ppg, rpg:d.rpg, apg:d.apg
    });
  }
  out.sort((a,b) => b.globalPlus - a.globalPlus);
  out.forEach((p,i) => p.rank = i + 1);
  return { players: out, defAvg: dAvg };
}

// ──────────────────────────────────────────────────────────────
// Rendering
// ──────────────────────────────────────────────────────────────
function rankCls(r) { return r<=5?'rank-top5':r<=20?'rank-top20':r<=50?'rank-top50':''; }
function defCls(s)  { if (s===null||s===undefined) return 'rat-low'; return s>=28?'rat-elite':s>=20?'rat-star':s>=14?'rat-avg':'rat-low'; }
function n(v, d=1)  { return (v===null || v===undefined || isNaN(v)) ? '—' : v.toFixed(d); }

function renderTop30(players) {
  const top = players.slice(0, 30);
  const html = top.map(p => `
    <tr>
      <td class="col-rank ${rankCls(p.rank)}">${p.rank}</td>
      <td class="col-player">
        <div class="player-name">${p.player}</div>
        <div class="player-team">${p.team ? `<img src="${logoUrl(p.team)}" alt="${p.team}" onerror="this.style.display='none'">` : ''}${p.team || ''}</div>
      </td>
      <td class="col-num col-gr">${p.globalPlus.toFixed(2)}</td>
      <td class="col-num">${p.gp!==null && p.gp!==undefined ? Math.round(p.gp) : '—'}</td>
      <td class="col-num">${n(p.mpg)}</td>
      <td class="col-num">${n(p.ppg)}</td>
      <td class="col-num">${n(p.rpg)}</td>
      <td class="col-num">${n(p.apg)}</td>
      <td class="col-num col-rat ${defCls(p.def)}">${p.def!==null?p.def.toFixed(1):'—'}</td>
    </tr>`).join('');
  document.getElementById('top30Body').innerHTML = html;
  document.getElementById('top30Wrap').style.display = '';
}

function renderTeams(players) {
  // Group by playoff team (defense-po TEAM).
  const byTeam = {};
  for (const p of players) {
    if (!p.team) continue;
    (byTeam[p.team] ||= []).push(p);
  }
  // Sort each team's players by GR+ desc and take top 15.
  // Players keep their GLOBAL rank (p.rank) — assigned in buildPlayers().
  const teams = Object.keys(byTeam).map(abbr => {
    const list = byTeam[abbr].sort((a,b) => b.globalPlus - a.globalPlus).slice(0, 15);
    return { abbr, name: TEAM_FULL[abbr] || abbr, players: list, topGR: list[0]?.globalPlus ?? 0 };
  });
  // Order teams alphabetically (Atlanta first).
  teams.sort((a,b) => a.abbr.localeCompare(b.abbr));

  // Shared thead — same columns as Top-30 table.
  const theadRow = `
    <thead>
      <tr>
        <th class="col-rank">#</th>
        <th>Player</th>
        <th style="text-align:right">Global Rating+</th>
        <th style="text-align:right" title="Playoff games played">GP</th>
        <th style="text-align:right" title="Minutes per game in the playoffs">MPG</th>
        <th style="text-align:right" title="Points per game in the playoffs">PPG</th>
        <th style="text-align:right" title="Rebounds per game in the playoffs">RPG</th>
        <th style="text-align:right" title="Assists per game in the playoffs">APG</th>
        <th style="text-align:right" title="Playoff DEF_SCORE composite">Def PO</th>
      </tr>
    </thead>`;

  const grid = document.getElementById('teamsGrid');
  grid.innerHTML = teams.map(t => {
    const rows = t.players.map(p => `
      <tr>
        <td class="col-rank ${rankCls(p.rank)}">${p.rank}</td>
        <td class="col-player">
          <div class="player-name">${p.player}</div>
        </td>
        <td class="col-num col-gr">${p.globalPlus.toFixed(2)}</td>
        <td class="col-num">${p.gp!==null && p.gp!==undefined ? Math.round(p.gp) : '—'}</td>
        <td class="col-num">${n(p.mpg)}</td>
        <td class="col-num">${n(p.ppg)}</td>
        <td class="col-num">${n(p.rpg)}</td>
        <td class="col-num">${n(p.apg)}</td>
        <td class="col-num col-rat ${defCls(p.def)}">${p.def!==null?p.def.toFixed(1):'—'}</td>
      </tr>`).join('');
    const logo = logoUrl(t.abbr);
    return `
      <div class="team-card">
        <div class="team-card-head">
          ${logo ? `<img src="${logo}" alt="${t.abbr}" onerror="this.style.display='none'">` : ''}
          <div>
            <div class="name">${t.name}</div>
            <div class="abbrev">${t.abbr} · ${t.players.length} players</div>
          </div>
          <span class="topgr">Top GR+ <b>${t.topGR.toFixed(2)}</b></span>
        </div>
        <div class="table-container">
          <table>
            ${theadRow}
            <tbody>${rows}</tbody>
          </table>
        </div>
      </div>`;
  }).join('');
  document.getElementById('teamsWrap').style.display = '';
}

// ──────────────────────────────────────────────────────────────
// Presto code generation
// ──────────────────────────────────────────────────────────────
// Copy-pastable HTML for a Presto post. Inline styles only — Presto
// strips CSS classes, so all visual hierarchy lives in style="…".
// Mirrors the on-page 9-column table (#, Player, GR+, GP, MPG, PPG,
// RPG, APG, Def PO). One <table> per section: Top-30 first, then
// alphabetical per-team Top-15 tables. Global ranks throughout.
function escapeHTML(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Color tiers — matches the on-page CSS classes (.rank-top5, etc.)
function prestoRankColor(r) {
  if (r <= 5)  return '#f0b637'; // gold
  if (r <= 20) return '#3b82f6'; // blue
  if (r <= 50) return '#0ea5e9'; // cyan
  return '#8892a6';              // muted
}
function prestoDefColor(d) {
  if (d == null || isNaN(d)) return '#8892a6';
  if (d >= 28) return '#b45309'; // elite
  if (d >= 20) return '#3b82f6'; // star
  if (d >= 14) return '#0ea5e9'; // solid
  return '#1a1a2e';              // avg
}

// Build one <thead>. `showTeam` adds team abbrev under the player
// name in body rows; the header itself is identical either way.
function prestoTableHead() {
  const th = 'padding:.45em .5em;font-family:sans-serif;font-size:.62em;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:#8892a6;border-bottom:1px solid #e2e5e9';
  return `    <thead>
      <tr style="background:#f3f4f6">
        <th style="${th};text-align:center;width:50px">#</th>
        <th style="${th};text-align:left">Player</th>
        <th style="${th};text-align:right">GR+</th>
        <th style="${th};text-align:right">GP</th>
        <th style="${th};text-align:right">MPG</th>
        <th style="${th};text-align:right">PPG</th>
        <th style="${th};text-align:right">RPG</th>
        <th style="${th};text-align:right">APG</th>
        <th style="${th};text-align:right">Def PO</th>
      </tr>
    </thead>
`;
}

// Build one <tr> for a player. `showTeam` adds the team abbrev as a
// muted sub-line under the player's name — used in the Top-30 table
// where rows span all teams. Per-team tables suppress it since the
// team is already in the h3 above.
function prestoRow(p, showTeam) {
  const td    = 'padding:.45em .5em;border-bottom:1px solid #e2e5e9;font-family:sans-serif;font-size:.84em;vertical-align:middle';
  const tdNum = td + ';text-align:right;font-family:\'JetBrains Mono\',monospace';
  const fmt   = (v, d=1) => (v != null && !isNaN(v)) ? v.toFixed(d) : '\u2014';
  const gp    = (p.gp != null && !isNaN(p.gp)) ? Math.round(p.gp) : '\u2014';
  const rankColor = prestoRankColor(p.rank);
  const defColor  = prestoDefColor(p.def);
  let playerCell = `<strong style="font-size:1.02em">${escapeHTML(p.player)}</strong>`;
  if (showTeam && p.team) {
    playerCell += `<div style="font-size:.78em;color:#5a6070;margin-top:.1em">${escapeHTML(p.team)}</div>`;
  }
  return `      <tr>
        <td style="${td};text-align:center;font-weight:700;color:${rankColor};font-size:.95em">${p.rank}</td>
        <td style="${td}">${playerCell}</td>
        <td style="${tdNum};font-weight:700;font-size:.9em">${p.globalPlus.toFixed(2)}</td>
        <td style="${tdNum}">${gp}</td>
        <td style="${tdNum}">${fmt(p.mpg)}</td>
        <td style="${tdNum}">${fmt(p.ppg)}</td>
        <td style="${tdNum}">${fmt(p.rpg)}</td>
        <td style="${tdNum}">${fmt(p.apg)}</td>
        <td style="${tdNum};font-weight:600;color:${defColor}">${fmt(p.def)}</td>
      </tr>
`;
}

function generatePresto() {
  if (!data || !data.players || !data.players.length) return '';
  const all = data.players;

  let out = '<div style="font-family:sans-serif;max-width:900px;margin:0 auto">\n';
  out += '  <p style="margin:0 0 .8em">Hoopsmatic\u2019s <strong>Global Rating Plus</strong> blends each player\u2019s 365-day base rating with their playoff defensive impact. Here are the leaders from the 2026 NBA Playoffs.</p>\n';
  out += '  <p style="margin:0 0 1em;font-size:.85em;color:#666"><em>GR+ = base rating + (playoff DEF_SCORE \u2212 league avg) \u00d7 0.2 + 1.5. Def PO composite \u2248 15 avg, mid-20s elite, low-30s DPOY-level.</em></p>\n';

  // ===== Top 30 =====
  const top30 = all.slice(0, 30);
  out += '  <h3 style="margin:1.4em 0 .4em;font-size:1.1em;border-bottom:2px solid #3b82f6;padding-bottom:.15em">Top 30 \u2014 2026 Playoffs</h3>\n';
  out += '  <table style="border-collapse:collapse;width:100%;margin-bottom:1em">\n';
  out += prestoTableHead();
  out += '    <tbody>\n';
  for (const p of top30) out += prestoRow(p, true);
  out += '    </tbody>\n  </table>\n';

  // ===== Per-team Top 15 (alphabetical by abbreviation) =====
  const byTeam = {};
  for (const p of all) {
    if (!p.team) continue;
    (byTeam[p.team] ||= []).push(p);
  }
  const abbrs = Object.keys(byTeam).sort((a,b) => a.localeCompare(b));
  for (const abbr of abbrs) {
    const list = byTeam[abbr].sort((a,b) => b.globalPlus - a.globalPlus).slice(0, 15);
    const teamName = TEAM_FULL[abbr] || abbr;
    const topGR = list[0] ? list[0].globalPlus.toFixed(2) : '\u2014';
    out += `  <h3 style="margin:1.4em 0 .4em;font-size:1.05em;border-bottom:2px solid #3b82f6;padding-bottom:.15em">${escapeHTML(teamName)} <span style="font-size:.7em;color:#666;font-weight:normal">(${abbr} \u00b7 Top GR+ ${topGR})</span></h3>\n`;
    out += '  <table style="border-collapse:collapse;width:100%;margin-bottom:1em">\n';
    out += prestoTableHead();
    out += '    <tbody>\n';
    for (const p of list) out += prestoRow(p, false);
    out += '    </tbody>\n  </table>\n';
  }

  out += '</div>';
  return out;
}

const PRESTO_BTN_LABEL = '\ud83d\udcf7 Copy Presto Code';
function flashButton(btn, msg, kind) {
  btn.textContent = msg;
  btn.classList.remove('success', 'error');
  if (kind === 'success') btn.classList.add('success');
  else if (kind === 'error') btn.classList.add('error');
  setTimeout(() => {
    btn.textContent = PRESTO_BTN_LABEL;
    btn.classList.remove('success', 'error');
  }, 2000);
}
function fallbackCopy(text, btn) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    flashButton(btn, '\u2713 Copied!', 'success');
  } catch (e) {
    flashButton(btn, 'Copy failed', 'error');
  }
  document.body.removeChild(ta);
}
function copyPresto() {
  const btn = document.getElementById('btnCopyPresto');
  const code = generatePresto();
  if (!code) { flashButton(btn, 'Nothing to copy', 'error'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code)
      .then(() => flashButton(btn, '\u2713 Copied!', 'success'))
      .catch(() => fallbackCopy(code, btn));
  } else {
    fallbackCopy(code, btn);
  }
}
document.getElementById('btnCopyPresto').addEventListener('click', copyPresto);

// ──────────────────────────────────────────────────────────────
// Boot
// ──────────────────────────────────────────────────────────────
let data = null;
async function init() {
  try {
    const [defR, rbR] = await Promise.all([
      fetch(DEFENSE_URL),
      fetch(RAT_BASE_URL)
    ]);
    if (!defR.ok) throw new Error(`Defense PO HTTP ${defR.status}`);
    if (!rbR.ok)  throw new Error(`PO RatBase HTTP ${rbR.status}`);
    const defJson = await defR.json();
    const rbCsv   = await rbR.text();
    const defMap   = parseDefPO(defJson);
    const poRatMap = parsePoRatBase(rbCsv);
    console.log('[GR+ PO] defMap=', Object.keys(defMap).length, 'poRatMap=', Object.keys(poRatMap).length);
    data = buildPlayers(defMap, poRatMap);
    if (!data.players.length) throw new Error('No qualifying players found (need both defensive entry and PO ratBase entry).');
    document.getElementById('loadingArea').style.display = 'none';
    renderTop30(data.players);
    renderTeams(data.players);
    document.getElementById('btnCopyPresto').disabled = false;
  } catch(err) {
    console.error('[GR+ PO] init failed:', err);
    document.getElementById('loadingArea').innerHTML =
      `<div class="error-msg">Failed to load 2026 playoffs ratings: ${err.message}</div>`;
  }
}
init();
</script>
