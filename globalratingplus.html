<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Global Rating Plus — Hoopsmatic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* === HOOPSMATIC DESIGN SYSTEM v1.0 === */
:root {
  --bg: #f8f9fa; --surface: #fff; --surface2: #f3f4f6;
  --border: #e2e5e9; --text: #1a1a2e; --text2: #5a6070; --text-muted: #8892a6;
  --accent: #3b82f6; --accent-dim: rgba(59,130,246,0.07);
  --accent-gold: #f0b637; --accent-cyan: #0ea5e9;
  --green: #16a34a; --red: #dc2626; --orange: #f59e0b;
  --pos: #10b981; --neg: #ef4444;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.5; }
::-webkit-scrollbar{height:5px;width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}

.header { padding:1.5rem 2rem 0.75rem; }
.header-inner { max-width:1200px; margin:0 auto; display:flex; align-items:baseline; gap:0.75rem; flex-wrap:wrap; }
.header h1, .header-brand h1 { font-weight:800; font-size:1.5rem; letter-spacing:-0.02em; color:var(--text); }
.header .tag { font-family:'JetBrains Mono',monospace; font-size:0.6rem; color:var(--accent); background:var(--accent-dim); padding:0.2em 0.6em; border-radius:4px; letter-spacing:0.04em; }
.header-subtitle { color:var(--text2); font-size:0.85rem; }

.stats-bar { max-width:1200px; margin:1rem auto 0; padding:0 2rem; display:grid; grid-template-columns:repeat(4,1fr); gap:0.75rem; }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1rem 1.15rem; }
.stat-card .label { font-family:'JetBrains Mono',monospace; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:0.2rem; }
.stat-card .value { font-weight:700; font-size:1.35rem; color:var(--text); }
.stat-card .value .unit { font-size:0.8rem; font-weight:400; color:var(--text2); }

.controls { max-width:1200px; margin:1.25rem auto 0; padding:0 2rem; display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center; }
.search-box { flex:1; min-width:200px; position:relative; }
.search-box input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:0.55rem 0.85rem 0.55rem 2.3rem; color:var(--text); font-family:inherit; font-size:0.85rem; outline:none; transition:border-color 0.2s; }
.search-box input:focus { border-color:var(--accent); }
.search-box input::placeholder { color:var(--text-muted); }
.search-box .icon { position:absolute; left:0.8rem; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.85rem; }
.filter-group { display:flex; gap:0.5rem; align-items:center; }
.filter-group label { font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; font-weight:600; }
select { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:0.55rem 0.85rem; color:var(--text); font-family:inherit; font-size:0.85rem; outline:none; cursor:pointer; }
select:focus { border-color:var(--accent); }
.ctrl-btn { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:0.5rem 1rem; color:var(--text); font-family:inherit; font-size:0.82rem; font-weight:500; cursor:pointer; transition:border-color 0.15s, background 0.15s; white-space:nowrap; }
.ctrl-btn:hover:not(:disabled) { border-color:var(--accent); background:var(--accent-dim); }
.ctrl-btn:disabled { opacity:0.4; cursor:default; }

.table-container { max-width:1200px; margin:1.25rem auto 3rem; padding:0 2rem; overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:0.82rem; }
thead th { position:sticky; top:0; z-index:10; background:var(--surface2); font-family:'JetBrains Mono',monospace; font-size:0.62rem; font-weight:500; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted); padding:0.6rem 0.5rem; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
tbody tr { border-bottom:1px solid var(--border); transition:background 0.12s; }
tbody tr:hover { background:rgba(59,130,246,0.03); }
tbody td { padding:0.55rem 0.5rem; vertical-align:middle; white-space:nowrap; }

.col-rank { width:55px; text-align:center; font-weight:700; font-size:0.95rem; }
.rank-top5 { color:var(--accent-gold); } .rank-top20 { color:var(--accent); } .rank-top50 { color:var(--accent-cyan); }
.col-player { min-width:200px; }
.player-name { font-weight:600; font-size:0.88rem; }
.player-team { font-size:0.72rem; color:var(--text2); margin-top:0.05rem; }
.col-num { text-align:right; font-family:'JetBrains Mono',monospace; font-size:0.82rem; }
.col-rat { font-weight:600; }
.rat-elite { color:#b45309; } .rat-star { color:var(--accent); } .rat-solid { color:var(--accent-cyan); } .rat-avg { color:var(--text); } .rat-low { color:var(--text-muted); }
.col-gr { font-weight:700; font-size:0.9rem; }
.def-adj-pos { color:var(--pos); font-size:0.7rem; margin-left:0.35rem; }
.def-adj-neg { color:var(--neg); font-size:0.7rem; margin-left:0.35rem; }

.loading-state { text-align:center; padding:4rem 2rem; color:var(--text2); }
.loading-spinner { display:inline-block; width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:hmSpin 0.8s linear infinite; margin:0 auto 1rem; }
@keyframes hmSpin { to { transform:rotate(360deg); } }
.error-msg { color:var(--red); max-width:600px; margin:0 auto; text-align:center; }

.methodology { max-width:1200px; margin:0 auto 3rem; padding:0 2rem; color:var(--text2); font-size:0.82rem; line-height:1.7; }
.methodology h3 { color:var(--text); font-size:0.95rem; margin-bottom:0.5rem; }
.methodology code { font-family:'JetBrains Mono',monospace; font-size:0.78rem; background:var(--surface2); padding:0.1em 0.4em; border-radius:4px; color:var(--text); }
.footer { max-width:1200px; margin:0 auto; padding:1.5rem 2rem 2.5rem; text-align:center; font-size:0.75rem; color:var(--text-muted); border-top:1px solid var(--border); }

@media(max-width:900px) { .stats-bar{grid-template-columns:repeat(2,1fr);} .controls{flex-direction:column;} .search-box{min-width:100%;} }
@media(max-width:600px) { .stats-bar{grid-template-columns:1fr 1fr;gap:0.5rem;} .stat-card{padding:0.75rem;} .stat-card .value{font-size:1.1rem;} .header{padding:1.25rem 1rem 1rem;} .header h1{font-size:1.25rem;} .table-container{padding:0 0.5rem;} td,th{padding:0.4rem 0.35rem;} }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-brand"><h1>NBA Global Rating Plus</h1></div>
    <span class="tag">GR+</span>
  </div>
</div>

<div class="controls">
  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search player or team…" disabled>
  </div>
  <div class="filter-group">
    <label>Team</label>
    <select id="teamFilter" disabled><option value="">All Teams</option></select>
  </div>
  <div class="filter-group">
    <label>Sort</label>
    <select id="sortSelect" disabled>
      <option value="globalPlus-desc">Global Rating+ ↓</option>
      <option value="globalPlus-asc">Global Rating+ ↑</option>
      <option value="def365-desc">Def 365 ↓</option>
      <option value="def365-asc">Def 365 ↑</option>
      <option value="ppg-desc">PPG ↓</option>
      <option value="rpg-desc">RPG ↓</option>
      <option value="apg-desc">APG ↓</option>
      <option value="mpg-desc">MPG ↓</option>
      <option value="gp-desc">GP ↓</option>
    </select>
  </div>
  <button class="ctrl-btn" id="refreshBtn" onclick="refreshData()" disabled>🔄 Refresh</button>
</div>

<div class="table-container" style="display:none" id="tableContainer">
  <table>
    <thead>
      <tr>
        <th class="col-rank">#</th>
        <th>Player</th>
        <th style="text-align:right">Global Rating+</th>
        <th style="text-align:right" title="Games played in the last 365 days">GP</th>
        <th style="text-align:right" title="Minutes per game (last 365 days)">MPG</th>
        <th style="text-align:right" title="Points per game (last 365 days)">PPG</th>
        <th style="text-align:right" title="Rebounds per game (last 365 days)">RPG</th>
        <th style="text-align:right" title="Assists per game (last 365 days)">APG</th>
        <th style="text-align:right" title="Defensive_365 composite score (≈15 avg, mid-20s elite, low-30s DPOY-level)">Def 365</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<div class="loading-state" id="loadingArea">
  <div class="loading-spinner"></div>
  <p>Loading ratings…</p>
</div>

<div class="methodology" style="display:none"></div>

<div class="footer">Hoopsmatic — NBA Global Rating Plus — Live data via HoopsMatic API</div>

<script>
// ── Config ──────────────────────────────────────────────────
const PROXY_BASE = 'https://hoopsmatic.com';
const RATINGS_URL = PROXY_BASE + '/api/rm-tv';
const DEFENSE_365_URL = PROXY_BASE + '/api/defense-365';

// Weight on the defensive factor. The boost added to RAT 365 is
// (DEF_SCORE − league avg) × DEF_WEIGHT — so it ADDS for above-average
// defenders and SUBTRACTS for below-average ones, centered on the league
// average. At 0.2 the defensive influence is a modest ~20% tilt: a player
// 10 points above average defensively gains +2.0 to their rating.
// Tune: 0.1 = very light · 0.2 = ~20% influence (default) · 0.5 = strong.
const DEF_WEIGHT = 0.2;

let appData = null;

// ── CSV parser ──────────────────────────────────────────────
function parseCSV(text) {
  const rows = []; let current = '', inQuotes = false, row = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i+1] === '"') { current += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else current += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(current.trim()); current = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(current.trim());
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = []; current = '';
      } else current += ch;
    }
  }
  if (current || row.length > 0) { row.push(current.trim()); if (row.length > 1 || row[0] !== '') rows.push(row); }
  return rows;
}

// ── Defensive_365 parser: { playerName: {def, gp, mpg, ppg, rpg, apg} } ──
function parseDef365(json) {
  const out = {};
  const rows = (json && json.values) ? json.values : null;
  if (!rows || rows.length < 3) return out;
  let headerIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 6); i++) {
    const cells = (rows[i] || []).map(c => (c || '').toString().trim().toUpperCase());
    if (cells.includes('PLAYER') && cells.includes('DEF_SCORE')) { headerIdx = i; break; }
  }
  if (headerIdx < 0) return out;
  const header = rows[headerIdx].map(h => (h || '').toString().trim().toUpperCase());
  const col = (name) => header.indexOf(name);
  const nameCol = col('PLAYER'), scoreCol = col('DEF_SCORE');
  const gpCol = col('GP'), mpgCol = col('MPG'), ppgCol = col('PPG'), rpgCol = col('RPG'), apgCol = col('APG');
  if (nameCol < 0 || scoreCol < 0) return out;
  const num = (row, c) => { if (c < 0) return null; const v = parseFloat(row[c]); return isNaN(v) ? null : v; };
  for (let r = headerIdx + 1; r < rows.length; r++) {
    const row = rows[r] || [];
    const name = (row[nameCol] || '').toString().trim();
    const score = parseFloat(row[scoreCol]);
    if (name && !isNaN(score)) {
      out[name] = {
        def: score,
        gp:  num(row, gpCol),
        mpg: num(row, mpgCol),
        ppg: num(row, ppgCol),
        rpg: num(row, rpgCol),
        apg: num(row, apgCol),
      };
    }
  }
  return out;
}

// ── Build the rating ────────────────────────────────────────
function processData(ratingsRows, def365Map) {
  const dataRows = ratingsRows.slice(1);
  const roster = [];
  // Ratings sheet (rm-tv): col 0 = TEAM, col 1 = PLAYER, col 2 = RAT 365.
  for (const row of dataRows) {
    while (row.length < 3) row.push('');
    const team = (row[0] || '').trim();
    const player = (row[1] || '').trim();
    const rat365 = parseFloat(row[2]) || 0;
    if (team && player) roster.push({ team, player, rat365 });
  }

  // League-average DEF_SCORE for the deviation baseline.
  const dVals = Object.values(def365Map).map(o => o && o.def).filter(v => typeof v === 'number' && !isNaN(v));
  const dHas = dVals.length > 0;
  const dAvg = dHas ? dVals.reduce((s,v) => s+v, 0) / dVals.length : 0;

  for (const p of roster) {
    const ds = def365Map[p.player] || null;
    p.def365 = (ds && typeof ds.def === 'number') ? ds.def : null;
    // 365 box-score stats (from the same Defensive_365 tab).
    p.gp  = ds ? ds.gp  : null;
    p.mpg = ds ? ds.mpg : null;
    p.ppg = ds ? ds.ppg : null;
    p.rpg = ds ? ds.rpg : null;
    p.apg = ds ? ds.apg : null;
    // Def boost = how far above/below league average, times the weight.
    p.defAdj = (dHas && p.def365 !== null) ? (p.def365 - dAvg) * DEF_WEIGHT : 0;
    // Apply a uniform +1.5 baseline shift so a smaller, more selective set of
    // genuinely below-replacement players end up negative. The relative
    // spacing between every player is preserved — this is a pure additive
    // floor adjustment, not a clamp.
    p.globalPlus = p.rat365 + p.defAdj + 1.5;
  }

  roster.sort((a,b) => b.globalPlus - a.globalPlus);
  roster.forEach((p,i) => p.rank = i + 1);

  return { players: roster, defAvg: dAvg, defHasData: dHas };
}

// ── Rendering ───────────────────────────────────────────────
function ratCls(r) { return r>=25?'rat-elite':r>=18?'rat-star':r>=10?'rat-solid':r>=4?'rat-avg':'rat-low'; }
function rankCls(r) { return r<=5?'rank-top5':r<=20?'rank-top20':r<=50?'rank-top50':''; }
function defCls(s) { if (s===null) return 'rat-low'; return s>=28?'rat-elite':s>=20?'rat-star':s>=14?'rat-avg':'rat-low'; }

function buildStats(d) {
  const avgGR = d.players.length ? d.players.reduce((s,p)=>s+p.globalPlus,0)/d.players.length : 0;
  const top = d.players[0];
  document.getElementById('statsBar').innerHTML = [
    {l:'Players Ranked', v:d.players.length, u:''},
    {l:'#1 Global Rating+', v:(top?top.player:'—'), u:''},
    {l:'Top GR+', v:(top?top.globalPlus.toFixed(1):'—'), u:'pts'},
    {l:'Defense Weight', v:DEF_WEIGHT.toFixed(1), u:'×'},
  ].map(c => `<div class="stat-card"><div class="label">${c.l}</div><div class="value">${c.v}${c.u?` <span class="unit">${c.u}</span>`:''}</div></div>`).join('');
}

function renderTable(players) {
  const tb = document.getElementById('tableBody');
  const n = (v, d=1) => (v===null || v===undefined || isNaN(v)) ? '—' : v.toFixed(d);
  tb.innerHTML = players.map(p => {
    return `<tr>
      <td class="col-rank ${rankCls(p.rank)}">${p.rank}</td>
      <td class="col-player"><div class="player-name">${p.player}</div><div class="player-team">${p.team}</div></td>
      <td class="col-num col-gr">${p.globalPlus.toFixed(2)}</td>
      <td class="col-num">${p.gp!==null && p.gp!==undefined ? Math.round(p.gp) : '—'}</td>
      <td class="col-num">${n(p.mpg)}</td>
      <td class="col-num">${n(p.ppg)}</td>
      <td class="col-num">${n(p.rpg)}</td>
      <td class="col-num">${n(p.apg)}</td>
      <td class="col-num col-rat ${defCls(p.def365)}">${p.def365!==null?p.def365.toFixed(1):'—'}</td>
    </tr>`;
  }).join('');
}

function update() {
  if (!appData) return;
  const search = document.getElementById('searchInput').value.toLowerCase();
  const team = document.getElementById('teamFilter').value;
  const [sortKey, sortDir] = document.getElementById('sortSelect').value.split('-');
  let f = appData.players.filter(p => {
    if (team && p.team !== team) return false;
    if (search && !p.player.toLowerCase().includes(search) && !p.team.toLowerCase().includes(search)) return false;
    return true;
  });
  const dir = sortDir === 'desc' ? -1 : 1;
  f.sort((a,b) => {
    const av = a[sortKey] ?? -Infinity, bv = b[sortKey] ?? -Infinity;
    return av < bv ? -1*dir : av > bv ? 1*dir : 0;
  });
  renderTable(f);
}

function populateTeamFilter(players) {
  const teams = [...new Set(players.map(p => p.team))].sort();
  const sel = document.getElementById('teamFilter');
  sel.innerHTML = '<option value="">All Teams</option>' + teams.map(t => `<option value="${t}">${t}</option>`).join('');
}

// ── Data loading ────────────────────────────────────────────
async function loadAll() {
  const [res, d365Res] = await Promise.all([
    fetch(RATINGS_URL),
    fetch(DEFENSE_365_URL).catch(e => { console.warn('[Defense365] Fetch failed:', e.message); return null; })
  ]);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const ratingsRows = parseCSV(await res.text());
  let def365Map = {};
  if (d365Res && d365Res.ok) {
    try { def365Map = parseDef365(await d365Res.json()); console.log('[Defense365] Map has', Object.keys(def365Map).length, 'players'); }
    catch(e) { console.warn('[Defense365] Parse error:', e.message); }
  } else {
    console.warn('[Defense365] No data — Global Rating+ falls back to RAT 365 only. Run pipeline with --include-365 and visit /defense/365 to populate.');
  }
  return processData(ratingsRows, def365Map);
}

async function init() {
  try {
    appData = await loadAll();
    document.getElementById('loadingArea').style.display = 'none';
    document.getElementById('tableContainer').style.display = 'block';
    document.getElementById('searchInput').disabled = false;
    document.getElementById('teamFilter').disabled = false;
    document.getElementById('sortSelect').disabled = false;
    document.getElementById('refreshBtn').disabled = false;
    populateTeamFilter(appData.players);
    // buildStats removed — stats-bar no longer rendered
    update();
    document.getElementById('searchInput').addEventListener('input', update);
    document.getElementById('teamFilter').addEventListener('change', update);
    document.getElementById('sortSelect').addEventListener('change', update);
  } catch(err) {
    document.getElementById('loadingArea').innerHTML = `<div class="error-msg">Failed to load ratings: ${err.message}</div>`;
  }
}

async function refreshData() {
  const btn = document.getElementById('refreshBtn');
  btn.textContent = '⏳ Loading...'; btn.disabled = true;
  try {
    appData = await loadAll();
    populateTeamFilter(appData.players);
    // buildStats removed — stats-bar no longer rendered
    update();
    btn.textContent = '✅ Updated';
    setTimeout(() => { btn.textContent = '🔄 Refresh'; }, 1500);
  } catch(err) {
    btn.textContent = '❌ Error';
    setTimeout(() => { btn.textContent = '🔄 Refresh'; }, 2000);
  }
  btn.disabled = false;
}

init();
</script>
</body>
</html>
